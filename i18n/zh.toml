# 简体中文翻译 —— 站点级覆盖
#
# 放在站点的 i18n/ 而不是主题里：主题是 git submodule，写进主题的文件会在
# `git submodule update` 时丢失，或让 submodule 变脏而无法更新。
#
# 覆盖主题 i18n/en.toml 的全部 119 个键。中文没有语法上的单复数，因此凡是
# 带 one/other 的键，两个值填相同 —— 只写 other 会让计数恰好为 1 的页面
# 回落到英文。
#
# 另外补了一个 `seach` 键：主题 layouts/partials/search.html 第 31/80/81 行
# 引用了它，但 en.toml 里并没有定义（是上游的拼写错误，少了一个 r），
# 结果页面上会直接漏出 "[i18n] seach"。这里一并补上。

