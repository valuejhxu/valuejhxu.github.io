## Base URL for the site
baseURL = 'https://valuejhxu.github.io/'
## Site title
title = 'Valuejhxu'
## Use hugo-brewm theme
theme = 'hugo-brewm'
## Enable Git information for pages, (e.g. lastMod date information)
enableGitInfo = false
## NOTE: canonifyURLs is deliberately NOT set. It rewrites every in-content relative URL
## to absolute at render time, which bakes whatever baseURL was active into the output —
## that is how a previous manual build published a site full of http://localhost:1313
## links. The deploy workflow passes --baseURL, so absolute asset URLs work without it.
## Default language for content
defaultContentLanguage = 'zh'
## Publish the single language at the site root (/post/...) instead of /zh/post/...
defaultContentLanguageInSubdir = false
## Show placeholder for missing translations
enableMissingTranslationPlaceholders = true
## Use sections for main menu
# sectionPagesMenu = 'main'
## Files to ignore when building site
ignoreFiles = [ '\.redacted', '\.old','\.bak', '\.tmp', '\.swp', '\.DS_Store']
## Errors to ignore in logs
# ignoreLogs = ['err-youtube-remote']
## Copyright notice
copyright = 'Copyright 2024-2026 Valuejhxu'

## Front matter field configurations
[frontmatter]
    ## Publication date fields
    date = [':default']
    ## Expiry date fields
    expiryDate = ['expiryDate', 'unpublishdate', ':default']
    ## Last modified date fields
    lastmod = ['lastmod', ':default'] ## ":fileModTime"

## Markup configuration
[markup]

    ## Table of contents settings
    [markup.tableOfContents]
        ## Minimum heading level to include
        startLevel = 2
        ## Maximum heading level to include
        endLevel = 3
        ## Use ordered list for TOC
        ordered = false

    ## Code highlighting settings
    [markup.highlight]
        ## Enable code fence highlighting
        codeFences = true
        ## Lines to highlight
        hl_Lines = ""
        ## Starting line number
        lineNoStart = 1
        ## Show line numbers
        lineNos = true
        ## Put line numbers in table
        lineNumbersInTable = true
        ## Use classes for styling
        noClasses = false
        ## Width of tab character
        tabWidth = 4

    ## Goldmark markdown processor settings
    [markup.goldmark]
        [markup.goldmark.renderer]
            ## Allow HTML in markdown
            unsafe = true
        ## Hand math to the render hook at layouts/_default/_markup/render-passthrough.html,
        ## which renders it to MathML/HTML at build time via transform.ToMath and sets
        ## the per-page "hasMath" flag the theme uses to decide whether to load KaTeX CSS.
        ## NOTE: inline '$' is active site-wide — escape literal dollar amounts as \$
        [markup.goldmark.extensions.passthrough]
            enable = true
            [markup.goldmark.extensions.passthrough.delimiters]
                block = [['\[', '\]'], ['$$', '$$'], ['\begin{equation}', '\end{equation}'], ['\begin{align}', '\end{align}']]
                inline = [['\(', '\)'], ['$', '$']]

## Sitemap configuration
[sitemap]
    ## Change frequency setting (will affect posts listings layout): 'always', 'hourly', 'daily', 'weekly', 'monthly', 'yearly', 'never'
    # changeFreq = 'monthly'
    ## Disable sitemap generation
    # disable = false
    ## Output filename
    # filename = 'sitemap.xml'
    ## Priority setting
    # priority = -1

## RSS configuration
[services.rss]
    ## Limit RSS item
    limit = -1

## Taxonomy configuration
[taxonomies]
    ## Category taxonomy
    category = "categories"
    ## Tag taxonomy
    tag = "tags"
    ## Series taxonomy
    series = "series"

## Site parameters
[params]
    ## Site title
    title = "Valuejhxu's Blog"
    ## Site description
    description = "Valuejhxu 的个人博客 - 技术分享与生活记录"
    ## Copyright notice
    copyright = "Copyright 2024-2026 Valuejhxu"
    ## Generate a robots.txt
    enableRobotsTXT = true
    ## Enable extended metadata (social cards)
    extMeta = true
    ## Coffee metric is a theme easter egg ("this site took N cups of coffee");
    ## it reads awkwardly in Chinese, so it stays off.
    coffeeStat = false

    ## Author information
    [params.author]
        ## site author's name
        name = 'Valuejhxu'
        ## Author's email (will be used for RSS feed)
        email = 'valuejhxu@gmail.com'

    ## Comments configuration
    [params.comments]
        ## Disable comments (disable fediverse comments)
        disabled = true
        ## Comment platform selection, currently only 'fediverse' is supported, further options to be determined
        # platform = 'fediverse'

    ## Fediverse integration settings
    [params.fediverse]
        ## Fediverse instance URL
        # instance = 'example.com'
        ## Fediverse username
        # username = 'username'

    ## Logo configuration
    [params.logo]
        ## Light mode logo mark
        # logoMark = 'https://example.com/logoMark.svg'
        ## Dark mode logo mark
        # logoMarkDark = 'https://example.com/logoMarkDark.svg'
        ## Enable logo type
        logoType = true

    ## Feed display settings
    [params.feed]
        ## Enable flowlines
        flowlines = true
        ## Limit number of flowlines
        flowlinesLimit = 21
    
    ## Home page display settings
    [params.home]
        ## Enable slide carousel
        disableSlide = false
        ## Enable taxonomy listing carousel
        disableListing = false

    ## Post display settings
    [params.posts]
        ## Enable text justification
        justifying = false
        ## Disable paragraph indentation
        noIndent = false
        ## Show colophon section (including QR code)
        colophon = true
        ## disable redaction history
        disableHistory = false
        ## SHow related content
        related = true
        ## Show share buttons
        share = true

    ## Search configuration
    [params.search]
        ## Enable search functionality, please index your site first
        enable = true
        ## Use pagefind search when javascript enabled, currently only 'pagefind' is supported, further options to be determined
        pagefind = true
        ## fallback searchbox when javascript disabled, currently the options limited to 'mojeek', otherwise duckduckgo will be used
        # fallback = 'mojeek'

    ## Typography settings
    [params.typeface]
        ## Use web safe fonts (will overide font selection below)
        webSafe = false
        ## Serif font selection
        roman = 'crimson'
        ## Sans-serif font selection
        sans = 'inter'
        ## use typeface stored in local server (pleaase download font's uri first)
        localHost = false

    ## Extended Metadata and  Social card configuration
    [params.socialCard]
        ## Enable twitter and opengraph social cards (same .params.extMeta setting)
        enable = true
        ## Default social card image, recommended resolution: 1200 x 630px.
        ## Add static/images/social-card.png and point this at it to get link previews.
        # images = "/images/social-card.png"

        ## Enable Twitter cards
        # twitter = true
        ## Twitter creator handle
        # twitterCreator = "@username"
        ## Twitter site handle
        # twitterSite = "@username"

        ## Enable OpenGraph
        # opengraph = true
        ## Facebook App ID
        # facebookAppID = "123456789"
        ## Facebook Admin ID
        # facebookAdmin = "USER_ID"

        ## Schema.org (only meta, not fully supported)
        # schema = true
        ## JsonLD (cannot validate permalink)
        # jsonLD = true