## Single-language site (Chinese). The content lives under content/zh via contentDir,
## while defaultContentLanguageInSubdir = false in hugo.toml publishes it at the site
## root (/post/... rather than /zh/post/...).
[zh]
    contentDir = 'content/zh'
    disabled = false
    languageCode = 'zh-CN'
    languageDirection = 'ltr'
    languageName = '简体中文'
    weight = 1
    [zh.pagination]
        disableAliases = false
        pagerSize = 12
        path = 'page'
    [zh.taxonomies]
        author = 'author'
        category = 'categories'
        series = 'series'
        tag = 'tags'
