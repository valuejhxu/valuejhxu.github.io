    <!-- 创建更整洁的斜体连笔风格的"valuejhxu"签名 -->
    <g class="signature" stroke="#000000" fill="none" transform="skewX(-12)">
        <!-- 更整洁的连笔效果 - 单一路径 -->
        <path d="M 80,110 
                 C 85,130 95,150 110,160 
                 C 125,150 135,130 140,115
                 C 145,110 150,105 155,110
                 C 160,115 160,140 165,160
                 C 168,162 172,160 175,150
                 C 180,130 180,100 180,90
                 C 182,95 185,130 190,160
                 C 195,170 205,160 210,130
                 C 210,145 210,155 215,160
                 C 225,165 235,160 240,140
                 C 245,130 245,125 250,130
                 C 255,135 260,140 265,140
                 C 265,120 275,110 285,115
                 C 295,125 290,140 265,140
                 C 270,150 280,160 295,150
                 C 305,145 310,130 315,120
                 C 317,122 318,130 318,140
                 C 318,155 318,170 318,180
                 C 315,190 300,190 290,180
                 M 318,95 C 318,90 318,90 318,95
                 M 318,115 C 325,100 330,95 335,90
                 C 337,95 335,120 335,150
                 C 335,155 335,160 335,160
                 M 335,120 C 345,110 355,115 360,125
                 C 365,135 370,145 375,150
                 C 380,150 385,140 390,130
                 C 395,120 400,115 410,110
                 C 405,120 395,135 385,150
                 C 400,145 415,140 425,130
                 C 430,125 435,120 440,120
                 C 440,135 440,150 445,160
                 C 455,165 465,160 470,150
                 C 475,140 480,125 485,120
                 C 505,115 525,130 545,140"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="signature-stroke" />
    </g>

    <!-- 落款线 -->
    <path d="M 80,200 C 140,205 280,195 550,190" 
          stroke="#000000" stroke-width="1.5" stroke-linecap="round" class="underline"/>

    <!-- 动态绘制效果 - 只保留签名动画，等高线改为静态 -->
    <style>
        @keyframes drawSignature {
            0% { stroke-dashoffset: 3000; }
            100% { stroke-dashoffset: 0; }
        }
        
        @keyframes drawUnderline {
            0% { stroke-dashoffset: 600; }
            100% { stroke-dashoffset: 0; }
        }
        
        .signature-stroke {
            stroke-dasharray: 3000;
            animation: drawSignature 5s ease-out forwards;
        }
        
        .underline {
            stroke-dasharray: 600;
            animation: drawUnderline 1s ease-out forwards;
            animation-delay: 4.5s;
        }
        
        .contour-line {
            opacity: 0.5;
            stroke-width: 0.8;
        }
        
        /* 新增细线样式 */
        .contour-line[stroke-width="0.2"],
        .contour-line[stroke-width="0.15"] {
            opacity: 0.3;
        }

        /* 外延等高线 */
        .ext-contour {
            opacity: 0.3;
            stroke-linecap: round;
        }

        /* 密度控制线 */
        .dense-line {
            opacity: 0.25;
            stroke-dasharray: 3,8;
        }

        /* 签名强化 */
        .signature {
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
        }

        /* 层次调整 */
        path:nth-child(n+15):nth-child(-n+20) {
            stroke-width: 0.6;
            opacity: 0.4;
        }
    </style>
</svg>